services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lekka_ai_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lekka_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lekka_ai}
      POSTGRES_DB: ${POSTGRES_DB:-lekka_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lekka_ai} -d $${POSTGRES_DB:-lekka_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
