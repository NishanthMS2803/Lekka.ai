[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lekka-ai"
version = "0.1.0"
description = "A multi-agent financial research system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "tenacity>=9.0.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.34.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
lekka = "lekka_ai.cli:app"
lekka-ai = "lekka_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lekka_ai"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "lekka_ai.*"
strict = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "db: tests that interact with the PostgreSQL database",
    "live: tests that make live calls to external providers (run with RUN_LIVE=1)",
]

