repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^(src|tests)/
        additional_dependencies:
          - pydantic-settings>=2.0.0
          - structlog>=24.0.0
          - sqlalchemy>=2.0.0
          - pytest>=8.0.0
          - google-genai>=2.29.0
          - tenacity>=9.0.0
          - fastapi>=0.115.0
          - httpx>=0.28.0
          - pandas-stubs>=2.2.0
